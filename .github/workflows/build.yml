name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify ASIN identity checks
        run: node --test tests/asin-identity.test.js

      - name: Build and Publish Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release after both platforms succeed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (tag !== `v${version}`) throw new Error('Tag and package version differ');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) throw new Error(`Release ${tag} not found`);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            for (const name of [
              `amazon-patrol-${version}.exe`, `amazon-patrol-${version}.zip`,
              `amazon-patrol-${version}-x64-mac.zip`, `amazon-patrol-${version}-arm64-mac.zip`,
              'latest.yml', 'latest-mac.yml'
            ]) {
              if (!assets.some(a => a.name === name && a.size > 0)) {
                throw new Error(`Missing release asset: ${name}`);
              }
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, name: tag,
              body: fs.readFileSync(`docs/releases/${tag}.md`, 'utf8'),
              draft: false, prerelease: false, make_latest: 'true'
            });

  build-mac:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate macOS icon
        run: |
          mkdir icon.iconset
          sips -z 16 16   assets/icons/icon256.png --out icon.iconset/icon_16x16.png
          sips -z 32 32   assets/icons/icon256.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32   assets/icons/icon256.png --out icon.iconset/icon_32x32.png
          sips -z 64 64   assets/icons/icon256.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icons/icon256.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icons/icon256.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icons/icon256.png --out icon.iconset/icon_256x256.png
          iconutil -c icns icon.iconset -o assets/icons/icon.icns
          rm -rf icon.iconset

      - name: Install dependencies
        run: npm ci

      - name: Verify ASIN identity checks
        run: node --test tests/asin-identity.test.js

      - name: Build and Publish Mac
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
